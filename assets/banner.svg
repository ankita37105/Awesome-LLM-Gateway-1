<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background: #080c14; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="gateway-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8)); }
      }
      @keyframes flowLeft {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowRight {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 40; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; stroke: #38bdf8; }
      }
      .flow-line-left {
        stroke: #38bdf8;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: flowLeft 1.5s linear infinite;
      }
      .flow-line-right {
        stroke: #c084fc;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: flowRight 1.5s linear infinite;
      }
      .gateway-core {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .pulse-badge {
        animation: badgePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="420" fill="url(#grid)" rx="12" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow-cyan)" />
  <circle cx="600" cy="220" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow-purple)" />
  <circle cx="1050" cy="320" r="120" fill="#c084fc" opacity="0.08" filter="url(#glow-purple)" />

  <!-- Top Header Title -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <text font-size="32" font-weight="900" fill="url(#accent-grad)" letter-spacing="1.5">⚡ AWESOME LLM GATEWAY ECOSYSTEM 🚀</text>
    <text y="28" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.5">The Unified Control Plane for Multi-Model Routing, Fallbacks, Caching, Observability &amp; Cost Governance</text>
  </g>

  <!-- Connection Flow Lines -->
  <!-- Left to Center -->
  <path d="M 230 190 C 330 190, 350 210, 440 210" fill="none" class="flow-line-left" />
  <path d="M 230 250 C 330 250, 350 230, 440 230" fill="none" class="flow-line-left" />

  <!-- Center to Right Models -->
  <path d="M 760 190 C 830 190, 870 150, 950 150" fill="none" class="flow-line-right" />
  <path d="M 760 210 C 840 210, 870 210, 950 210" fill="none" class="flow-line-right" />
  <path d="M 760 230 C 840 230, 870 270, 950 270" fill="none" class="flow-line-right" />
  <path d="M 760 250 C 830 250, 870 330, 950 330" fill="none" class="flow-line-right" />

  <!-- LEFT BOXES: Apps & Agents -->
  <g transform="translate(70, 150)">
    <rect width="160" height="60" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="27" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">🤖 AI Agents / Apps</text>
    <text x="80" y="47" font-size="11" fill="#38bdf8" text-anchor="middle">OpenAI API SDK</text>

    <rect y="80" width="160" height="60" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="107" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">⚡ Microservices</text>
    <text x="80" y="127" font-size="11" fill="#38bdf8" text-anchor="middle">LangChain / LlamaIndex</text>
  </g>

  <!-- CENTER CORE: LLM Gateway Platform -->
  <g transform="translate(440, 130)" class="gateway-core">
    <rect width="320" height="190" rx="12" fill="url(#gateway-grad)" stroke="#818cf8" stroke-width="2" />
    
    <rect width="320" height="38" rx="12" fill="#1e1b4b" opacity="0.8" />
    <text x="160" y="24" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">⚡ UNIFIED AI GATEWAY</text>

    <g transform="translate(20, 50)">
      <rect width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="65" y="18" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">🔀 Smart Routing</text>

      <rect x="150" width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="215" y="18" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">⚡ Semantic Cache</text>

      <rect y="38" width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="65" y="56" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">🛡️ AI Guardrails</text>

      <rect x="150" y="38" width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="215" y="56" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">🔄 Auto Fallbacks</text>

      <rect y="76" width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="65" y="94" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">💰 Spend Limits</text>

      <rect x="150" y="76" width="130" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" class="pulse-badge" />
      <text x="215" y="94" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">📊 Observability</text>
    </g>

    <text x="160" y="176" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">100+ Providers • Single Endpoint • Zero Markup</text>
  </g>

  <!-- RIGHT BOXES: LLM Providers -->
  <g transform="translate(950, 120)">
    <rect width="180" height="42" rx="6" fill="url(#box-grad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="90" y="26" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🟢 OpenAI / Azure</text>

    <rect y="58" width="180" height="42" rx="6" fill="url(#box-grad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="90" y="84" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🟣 Anthropic Claude</text>

    <rect y="116" width="180" height="42" rx="6" fill="url(#box-grad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="90" y="142" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🔵 Google Gemini</text>

    <rect y="174" width="180" height="42" rx="6" fill="url(#box-grad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="90" y="200" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🟠 DeepSeek / vLLM / Ollama</text>
  </g>

  <!-- Bottom Capability Tags -->
  <g transform="translate(600, 385)" text-anchor="middle">
    <text font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      ⚡ SAAS GATEWAYS &amp; ENTERPRISE PLATFORMS  •  🔥 OPEN-SOURCE PROXIES &amp; SELF-HOSTED GATEWAYS  •  🛡️ SECURITY &amp; COMPLIANCE
    </text>
  </g>
</svg>
